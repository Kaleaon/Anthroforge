name: Species anatomy editor tests

on:
  pull_request:
    paths:
      - "anthroforge-v2/species-mesh-lab/**"
      - ".github/workflows/species-anatomy-tests.yml"
  push:
    paths:
      - "anthroforge-v2/species-mesh-lab/**"
      - ".github/workflows/species-anatomy-tests.yml"

jobs:
  anatomy-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate species and anatomy profile data
        run: python anthroforge-v2/species-mesh-lab/scripts/validate_species_mesh_lab.py
      - name: Test persistent anatomy editing state
        working-directory: anthroforge-v2/species-mesh-lab
        run: python -m unittest discover -s tests -v
