name: Species mesh profile validation

on:
  pull_request:
    paths:
      - "anthroforge-v2/species-mesh-lab/**"
      - "anthroforge-v2/kaleaon/**"
      - ".github/workflows/species-mesh-validation.yml"
  push:
    branches: [main]
    paths:
      - "anthroforge-v2/species-mesh-lab/**"
      - "anthroforge-v2/kaleaon/**"

jobs:
  validate-profiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate species profiles and Blender script syntax
        run: python anthroforge-v2/species-mesh-lab/scripts/validate_species_mesh_lab.py
      - name: Validate Kaleaon blockout profile and Blender script syntax
        run: python anthroforge-v2/kaleaon/scripts/validate_kaleaon_profile.py
      - name: Run species mesh lab regression tests
        working-directory: anthroforge-v2/species-mesh-lab
        run: python -m unittest discover -s tests -v


  build-kaleaon-assets:
    runs-on: ubuntu-latest
    needs: validate-profiles
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          blender --version
      - name: Generate editable Kaleaon scene and GLB
        working-directory: anthroforge-v2/kaleaon
        run: blender --background --python scripts/build_kaleaon_blockout.py -- --output ./out
      - name: Verify Blender scene and exported GLB
        working-directory: anthroforge-v2/kaleaon
        run: blender --background --python scripts/verify_kaleaon_blender_output.py -- --output ./out
      - name: Upload editable model and GLB preview
        uses: actions/upload-artifact@v4
        with:
          name: kaleaon-blender-model
          path: |
            anthroforge-v2/kaleaon/out/Kaleaon_blockout.blend
            anthroforge-v2/kaleaon/out/Kaleaon_blockout.glb
          if-no-files-found: error
          retention-days: 14
